[project]
name = "daiw"
version = "1.5.0"
description = "Digital AI Workspace - AI-Powered Collaborative Music Production Platform"
authors = [
    {name = "DAIW Team", email = "team@daiw.ai"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "music-production",
    "ai",
    "ableton",
    "midi",
    "collaboration",
    "daw",
    "audio",
    "real-time"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Artistic Software",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # GUI Framework
    "PyQt6>=6.6.1",
    "qasync>=0.27.1",

    # Audio & MIDI
    "mido>=1.3.2",
    "python-osc>=1.8.3",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "numpy>=1.26.4",
    "scipy>=1.12.0",

    # Interactive Audio Features
    "yt-dlp>=2024.4.9",
    "demucs>=4.0.1",
    "sounddevice>=0.4.6",
    "aubio>=0.4.9",
    "pydub>=0.25.1",
    "resampy>=0.4.2",

    # CollabNet Collaboration
    "websockets>=12.0",

    # AI & LangChain
    "langchain>=0.1.20",
    "langchain-openai>=0.1.8",
    "langchain-anthropic>=0.1.13",
    "openai>=1.30.1",
    "anthropic>=0.25.9",

    # ML/PyTorch (optional)
    "torch>=2.2.2",
    "torchaudio>=2.2.2",

    # Utilities
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.11.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.2",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/DAIW"
Documentation = "https://github.com/yourusername/DAIW/tree/main/docs"
Repository = "https://github.com/yourusername/DAIW"
Issues = "https://github.com/yourusername/DAIW/issues"

[project.scripts]
daiw = "daiw.main:main"
daiw-server = "daiw.network.collabnet_server:run_server"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["daiw"]

[tool.setuptools.package-data]
daiw = ["**/*.ui", "**/*.qss", "**/*.json"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "collabnet: marks tests requiring collabnet server",
]
